name: Bug 报告
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先搜索是否已有相同问题。**安全问题不要在这里提**，见 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 http://localhost:3300/
        2. 用 admin/admin123 登录
        3. 进入「用户管理」点击新增
        4. 保存后列表没有出现新行
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: 运行方式
      options:
        - docker compose up -d（官方演示编排）
        - 本地开发（mvn spring-boot:run + pnpm dev）
        - 自行部署（WAR + Tomcat）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 输出 `git rev-parse --short HEAD`
      placeholder: e.g. 5294c23
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        后端：`docker compose logs --tail=100 backend`
        浏览器：F12 控制台的报错
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、JDK / Node 版本
      placeholder: e.g. macOS 14.6 arm64 / Chrome 130 / JDK 17
    validations:
      required: false
