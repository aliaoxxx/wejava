name: 功能建议
description: 提出一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案
      placeholder: 我在做 xxx 的时候，需要 yyy，现在只能 zzz
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 会改动数据库结构
        - label: 会改动现有接口的签名或返回结构
        - label: 只涉及前端
        - label: 只涉及文档
