server:
  port: 8080
  servlet:
    # 打成 war 后真正的上下文由 war 文件名决定（prod#api.war → /prod/api），
    # 这里配置用于 java -jar 内嵌容器的场景，两者保持一致。
    context-path: /prod/api
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:wejava}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

# 生产关闭接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.wejava: info
    root: warn
  file:
    name: ${LOG_PATH:/var/log/wejava}/wejava-backend.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
