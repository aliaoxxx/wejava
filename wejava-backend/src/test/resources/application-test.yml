spring:
  datasource:
    url: jdbc:h2:mem:wejava;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  # 测试用 H2，不跑 MySQL 的 Flyway 脚本
  flyway:
    enabled: false

mybatis-plus:
  db-type: H2

logging:
  level:
    com.wejava: info

# 单测不连 Redis，关闭 SSE 的跨实例订阅容器
wejava:
  sse:
    redis-subscriber: false
